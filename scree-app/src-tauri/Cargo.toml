[package]
name = "scree"
version = "0.1.0"
description = "A Tauri App"
authors = ["Jesse Raccio"]
edition = "2021"
# `src/bin/` holds tooling that is not the app — without this, adding the second
# binary made a bare `cargo run` ambiguous and stopped launching Scree.
default-run = "scree"

[lib]
name = "scree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Audio runs on a real-time deadline, and an unoptimized fundsp misses it. On a
# program holding six delay-tapped voices open, the callback costs 3% of real
# time with dependencies optimized and 122% without — the second one is not a
# near miss, it is silence with a gap in it every buffer. Optimizing them fully
# — fundsp is where all the DSP time goes — buys that back while this crate
# stays cheap to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
cpal = "0.18.1"
chumsky = "0.13.0"
fundsp = "0.23.0"
logos = "0.16.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
rand = "0.10"
rand_distr = "0.6"
trash = "5.2.6"
# Watches the open project's folder, so the tree picks up a file made by
# anything else without being asked to look. See `watcher.rs`.
notify = "8.2.0"
# Only for naming a recording after the moment it was played. Local time, not
# UTC: a take made at eleven at night should not be filed under the next day.
# Already in the tree behind `trash`, so this costs nothing to build.
chrono = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

